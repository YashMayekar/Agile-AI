<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data: https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://localhost:8000;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streaming Chat</title>

  <style>
    :root {
      --bg1: linear-gradient(135deg, #0f172a 0%, #001219 100%);
      --bubble-bg: linear-gradient(135deg, rgba(124, 92, 255, 0.12), rgba(0, 200, 255, 0.05));
      --accent: #7c5cff;
      --muted: rgba(255, 255, 255, 0.55);
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
      background: var(--bg1);
      color: #e6eef8;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 36px);
      padding: 18px;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--bubble-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
    }

    .heading {
      font-size: 16px;
      font-weight: 600;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
    }

    .chat-panel {
      flex: 1;
      overflow: auto;
      border-radius: 12px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
    }

    .message {
      max-width: 88%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      box-shadow: 0 6px 20px rgba(2, 6, 23, 0.6);
      position: relative;
    }

    .message.user {
      margin-left: auto;
      background: linear-gradient(90deg, rgba(124, 92, 255, 0.12), rgba(0, 200, 255, 0.06));
    }

    .message.assistant {
      margin-right: auto;
      border-left: 3px solid rgba(124, 92, 255, 0.18);
    }

    .rendered {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13.8px;
    }

    .rendered strong {
      color: var(--accent);
    }

    .rendered code {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 4px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }

    .rendered pre.codeblock {
      margin: 8px 0;
      padding: 12px;
      border-radius: 8px;
      overflow: auto;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .rendered pre.codeblock code {
      background: none;
      padding: 0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: #dbeafe;
    }

    h1 {
      color: var(--accent);
      margin: 6px 0 8px 0;
      font-size: 18px;
    }

    /* Loading indicator (three dots) */
    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.15;
      animation: blink 1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes blink {
      0% {
        opacity: 0.15;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-6px);
      }

      100% {
        opacity: 0.15;
        transform: translateY(0);
      }
    }

    .composer {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-top: 10px;
    }

    .input {
      flex: 1;
      min-height: 44px;
      border-radius: 9px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.02);
      color: #e6eef8;
      border: 1px solid rgba(255, 255, 255, 0.03);
      resize: none;
      font-size: 13.5px;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      width: 150px;
      max-width: 300px;
    }

    .thinking-row {
      display: flex;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }

    #Thinking {
      background: var(--bg1);
      color: #e6eef8;
      border: 1px solid #ccc;
      padding: 5px;
    }

    #Thinking option {
      background: var(--bg1);
      color: black;
    }

    button.send {
      border: none;
      background: linear-gradient(90deg, #7c5cff, #00c8ff);
      color: white;
      width: 100%;
      padding: 10px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">AI</div>
      <div>
        <div class="heading">Agile AI Assistant</div>
      </div>
    </div>

    <div id="chat" class="chat-panel"></div>

    <div class="composer">
      <textarea id="input" class="input" rows="2" placeholder="Type your message..."></textarea>

      <div class="button-container">
        <button id="send" class="send">Send</button>
        <div class="thinking-row">
          <label for="Thinking">Thinking:</label>
          <select name="Thinking" id="Thinking">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    const projectId = "{{projectId}}";

    const chat = document.getElementById('chat');
    let typingIndicator = null;          // for the old loader (kept for compatibility)
    let currentAssistantMessageDiv = null;
    let currentAssistantMessageContent = '';
    let lastStatusStr = '';
    let currentSystemMessageDiv = null;
    let statusIntervalId = null;
    let statusSeconds = 0;
    let statusDotCount = 0;
    let statusIsThinking = false;
    let statusBaseText = '';

    /**
     * Convert plain text with markdown‑like syntax to safe HTML.
     * Supports:
     *   - **bold** → <strong>
     *   - `inline code` → <code>
     *   - triple backtick code blocks → <pre class="codeblock"><code>...</code></pre>
     *   - newlines → <br>
     */
    function renderMessageText(text) {
      if (!text) return '';

      // First, extract code blocks so they aren't processed by other rules
      const blocks = [];
      text = text.replace(/```([\s\S]*?)```/g, (match, code) => {
        blocks.push(code);
        return `%%CODEBLOCK${blocks.length - 1}%%`;
      });

      // Escape HTML special characters
      let escaped = text.replace(/[&<>"]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });

      // Bold: **text** (must be non-greedy)
      escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      // Inline code: `text`
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Newlines to <br>
      escaped = escaped.replace(/\n/g, '<br>');

      // Restore code blocks
      escaped = escaped.replace(/%%CODEBLOCK(\d+)%%/g, (match, index) => {
        const code = blocks[index];
        // Escape code inside block as well (but already safe, just ensure no injection)
        const safeCode = code.replace(/[&<>]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
        return `<pre class="codeblock"><code>${safeCode}</code></pre>`;
      });

      return escaped;
    }

    /**
     * Add a message bubble to the chat.
     * sender: 'user' or 'assistant' (bot)
     * text: raw message string
     * isTyping: if true, shows a loader instead of text (old style, kept for compatibility)
     */
    function addMessage(sender, text, isTyping = false) {
      // If there's an existing typing indicator from the same sender, remove it
      if (sender === 'assistant' && typingIndicator) {
        typingIndicator.remove();
        typingIndicator = null;
      }

      const div = document.createElement('div');
      div.className = `message ${sender === 'user' ? 'user' : 'assistant'}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'rendered';

      if (isTyping) {
        // Show a loader (old style)
        const loader = document.createElement('div');
        loader.className = 'loader';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot';
          loader.appendChild(dot);
        }
        contentDiv.appendChild(loader);
        typingIndicator = div;  // remember this element so we can remove it later
      } else {
        // Render actual message
        contentDiv.innerHTML = renderMessageText(text);
      }

      div.appendChild(contentDiv);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    // Handle send button
    document.getElementById('send').onclick = () => {
      const input = document.getElementById('input');
      const val = input.value.trim();
      if (!val) return;

      // Add user message immediately
      addMessage('user', val);

      // Reset streaming state for new assistant message
      currentAssistantMessageDiv = null;
      currentAssistantMessageContent = '';

      // Send message to extension
      vscode.postMessage({
        command: 'sendMessage',
        text: val
      });

      input.value = '';
    };

    // Allow Enter to send (but Shift+Enter for newline)
    document.getElementById('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('send').click();
      }
    });

    // Listen for messages from the extension
    window.addEventListener('message', e => {
      const msg = e.data;
      if (msg.type === 'addMessage') {
        // This is for user messages or maybe fallback
        addMessage(msg.sender, msg.message, false);
      } else if (msg.type === 'botChunk') {
        // If this is the first chunk, create the assistant message div
        if (!currentAssistantMessageDiv) {
          if (statusIntervalId) {
            clearInterval(statusIntervalId);
            statusIntervalId = null;
          }
          if (currentSystemMessageDiv) {
            currentAssistantMessageDiv = currentSystemMessageDiv;
            currentSystemMessageDiv = null;
            currentAssistantMessageDiv.querySelector('.rendered').innerHTML = ''; // Clear status text
          } else {
            currentAssistantMessageDiv = document.createElement('div');
            currentAssistantMessageDiv.className = 'message assistant';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'rendered';
            currentAssistantMessageDiv.appendChild(contentDiv);
            chat.appendChild(currentAssistantMessageDiv);
          }
        }
        const contentDiv = currentAssistantMessageDiv.querySelector('.rendered');
        currentAssistantMessageContent += msg.chunk;
        contentDiv.innerHTML = renderMessageText(currentAssistantMessageContent);
        chat.scrollTop = chat.scrollHeight;
      } else if (msg.type === 'botMessage') {
        // Final message: if we have been streaming, replace content; otherwise create new
        if (currentAssistantMessageDiv) {
          // Already streaming, just ensure content is complete
          const contentDiv = currentAssistantMessageDiv.querySelector('.rendered');
          contentDiv.innerHTML = renderMessageText(msg.message);
          currentAssistantMessageDiv = null;
          currentAssistantMessageContent = '';
        } else {
          // No streaming, just add the message normally
          addMessage('assistant', msg.message, false);
        }
        // Optionally handle actions
        if (msg.actions) {
          console.log('Actions:', msg.actions);
        }
      } else if (msg.type === 'error') {
        if (statusIntervalId) {
          clearInterval(statusIntervalId);
          statusIntervalId = null;
        }
        // Show error message
        addMessage('assistant', `❌ ${msg.message}`, false);
        // Reset streaming state
        currentAssistantMessageDiv = null;
        currentAssistantMessageContent = '';
      } else if (msg.type === 'clearMessages') {
        if (statusIntervalId) {
          clearInterval(statusIntervalId);
          statusIntervalId = null;
        }
        chat.innerHTML = '';
        currentAssistantMessageDiv = null;
        currentAssistantMessageContent = '';
        lastStatusStr = '';
        currentSystemMessageDiv = null;
      } else if (msg.type === 'statusUpdate') {
        if (msg.data && msg.data.message) {
          const str = msg.data.object ? msg.data.object + '|' + msg.data.message : msg.data.message;
          if (str !== lastStatusStr) {
            lastStatusStr = str;
            let textToShow = `ℹ️ ${msg.data.message}`;
            if (msg.data.message.includes('INITIAL')) {
              textToShow = msg.data.message;
            } else if (msg.data.object === 'LLM' && msg.data.message === 'THINKING') {
              textToShow = 'ℹ️ Thinking';
            }

            if (!currentSystemMessageDiv) {
              currentSystemMessageDiv = document.createElement('div');
              currentSystemMessageDiv.className = 'message assistant';
              const contentDiv = document.createElement('div');
              contentDiv.className = 'rendered';
              currentSystemMessageDiv.appendChild(contentDiv);
              chat.appendChild(currentSystemMessageDiv);
            }

            statusBaseText = textToShow;
            statusIsThinking = (msg.data.object === 'LLM' && msg.data.message === 'THINKING');
            statusSeconds = 0;
            statusDotCount = 1;

            currentSystemMessageDiv.querySelector('.rendered').innerHTML = statusBaseText + '.';
            chat.scrollTop = chat.scrollHeight;

            if (statusIntervalId) clearInterval(statusIntervalId);
            statusIntervalId = setInterval(() => {
              if (!currentSystemMessageDiv) {
                clearInterval(statusIntervalId);
                return;
              }
              statusSeconds++;
              statusDotCount = (statusDotCount % 4) + 1; // 1, 2, 3 dots
              let dots = '.'.repeat(statusDotCount);

              let displayStr = statusBaseText;
              if (statusIsThinking && statusSeconds >= 5) {
                const moreCount = Math.floor(statusSeconds / 5);
                if (moreCount === 1) {
                  displayStr = 'ℹ️ Thinking harder';
                } else if (moreCount > 1) {
                  const mores = 'more '.repeat(moreCount - 1);
                  displayStr = `ℹ️ Thinking ${mores}harder`;
                }
              }

              let cDiv = currentSystemMessageDiv.querySelector('.rendered');
              if (cDiv) cDiv.innerHTML = displayStr + dots;
            }, 1000);
          }
        }
      }
    });
  </script>

</body>

</html>
