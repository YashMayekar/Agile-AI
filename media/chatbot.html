<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; img-src data: https:; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'unsafe-inline'; connect-src http://localhost:8000;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streaming Chat</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@350;450;550;650&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg-primary: #05070f;
      --bg-secondary: #0a0f1f;
      --bg-tertiary: #0f1633;
      --bg-elevated: #0e1431;
      --accent-primary: #8942fa;
      --accent-secondary: #b153fe;
      --accent-tertiary: #d13afb;
      --accent-gradient: linear-gradient(135deg, #8942fa, #b153fe, #d13afb);
      --text-primary: #e6f0ff;
      --text-secondary: #9fb3d9;
      --text-tertiary: #5c6f99;
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-default: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(137, 66, 250, 0.4);
      --bubble-user-bg: rgba(137, 66, 250, 0.15);
      --bubble-user-border: rgba(137, 66, 250, 0.3);
      --bubble-assistant-bg: rgba(255, 255, 255, 0.05);
      --bubble-assistant-border: rgba(255, 255, 255, 0.1);
      --shadow-glow: 0 0 28px rgba(137, 66, 250, 0.45);
      --shadow-float: 0 10px 40px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(124, 92, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 92, 255, 0.03) 1px, transparent 1px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 650;
      font-size: 1.3rem;
      box-shadow: var(--shadow-glow), var(--shadow-float);
      position: relative;
      overflow: hidden;
    }

    .logo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.3), transparent);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .heading {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .subheading {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 450;
    }

    .thoughts-box {
      position: absolute;
      top: 2vh;
      right: 32px;
      border: 1px solid var(--border-default);
      border-radius: 16px;
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 13px;
      padding: 16px 20px;
      cursor: pointer;
      min-width: 280px;
      max-width: 420px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow-float), 0 0 0 1px rgba(0,0,0,0.5);
      backdrop-filter: blur(20px);
      z-index: 100;
      max-height: 60vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .thoughts-box:hover {
      border-color: var(--border-focus);
    }

    .thoughts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 550;
      color: var(--accent-primary);
      gap: 16px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .thoughts-content {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-secondary);
      font-size: 12px;
      line-height: 1.5;
      flex: 1;
      min-height: 0; 
    }

    .thoughts-content::-webkit-scrollbar { 
      width: 6px; 
    }
    .thoughts-content::-webkit-scrollbar-track { 
      background: transparent; 
    }
    .thoughts-content::-webkit-scrollbar-thumb { 
      background: var(--border-default); 
      border-radius: 3px; 
    }
    .thoughts-content::-webkit-scrollbar-thumb:hover { 
      background: var(--border-focus); 
    }

    .thoughts-box.expanded {
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(124, 92, 255, 0.2);
    }

    .thoughts-box.expanded .thoughts-content {
      display: block;
      animation: slide-down 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-panel {
      flex: 1;
      overflow-y: auto;
      border-radius: 20px;
      padding: 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .chat-panel::-webkit-scrollbar {
      width: 8px;
    }

    .chat-panel::-webkit-scrollbar-track {
      background: transparent;
      margin: 8px 0;
    }

    .chat-panel::-webkit-scrollbar-thumb {
      background: var(--border-default);
      border-radius: 4px;
      border: 2px solid var(--bg-secondary);
    }

    .chat-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(124, 92, 255, 0.3);
    }

    .message {
      max-width: 85%;
      margin-bottom: 24px;
      padding: 16px 20px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 14.5px;
      animation: message-appear 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(12px);
      position: relative;
    }

    @keyframes message-appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      margin-left: auto;
      background: var(--bubble-user-bg);
      border: 1px solid var(--bubble-user-border);
      color: var(--text-primary);
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 24px rgba(124, 92, 255, 0.1);
    }

    .message.assistant {
      margin-right: auto;
      background: var(--bubble-assistant-bg);
      border: 1px solid var(--bubble-assistant-border);
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }

    .rendered {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .rendered strong {
      color: var(--accent-secondary);
      font-weight: 650;
    }

    .rendered em {
      color: var(--accent-tertiary);
      font-style: italic;
    }

    .rendered code {
      background: rgba(124, 92, 255, 0.1);
      padding: 3px 6px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--accent-secondary);
      border: 1px solid rgba(124, 92, 255, 0.2);
    }

    .rendered pre.codeblock {
      margin: 16px 0;
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      background: #0f0f14;
      border: 1px solid var(--border-default);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .rendered pre.codeblock code {
      background: none;
      padding: 0;
      color: #e2e8f0;
      font-size: 13px;
      border: none;
      line-height: 1.6;
    }

    .rendered h1, .rendered h2, .rendered h3 {
      color: var(--text-primary);
      margin: 24px 0 12px 0;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .rendered h1 { font-size: 1.5em; }
    .rendered h2 { font-size: 1.25em; }
    .rendered h3 { font-size: 1.1em; }

    .rendered ul, .rendered ol {
      margin: 12px 0;
      padding-left: 20px;
    }

    .rendered li {
      margin: 4px 0;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-primary);
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { 
        transform: scale(0);
        opacity: 0.3;
      }
      40% { 
        transform: scale(1);
        opacity: 1;
      }
    }

    .composer {
      display: flex;
      gap: 16px;
      align-items: flex-center;
      padding: 16px;
      border-radius: 20px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-default);
      box-shadow: var(--shadow-float);
      position: relative;
    }

    .composer::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.3), transparent 50%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .input {
      flex: 1;
      min-height: 52px;
      max-height: 200px;
      border-radius: 14px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.2);
      color: var(--text-primary);
      border: 1px solid var(--bubble-assistant-border);
      resize: none;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
      line-height: 1.5;
    }

    .input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
    }

    .input::placeholder {
      color: var(--text-tertiary);
    }

    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 140px;
    }

    button.send {
      border: none;
      background: var(--accent-gradient);
      color: white;
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 550;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(124, 92, 255, 0.35);
      height: 52px;
      position: relative;
      overflow: hidden;
    }

    button.send.abort {
      background: linear-gradient(135deg, #f56565, #ed8936);
      box-shadow: 0 4px 20px rgba(245, 101, 101, 0.35);
    }

    button.send::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
    }

    button.send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(124, 92, 255, 0.5);
    }

    button.send.abort:hover {
      box-shadow: 0 6px 28px rgba(245, 101, 101, 0.5);
    }

    button.send:active {
      transform: translateY(0);
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }

    .mode-row label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #Mode {
      background: transparent;
      color: var(--accent-secondary);
      border: none;
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      outline: none;
      padding: 2px;
    }

    #Mode option {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .status-text {
      color: var(--accent-secondary);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-tertiary);
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .container {
        padding: 16px;
      }
      .message {
        max-width: 90%;
        padding: 14px 16px;
      }
      .thoughts-box {
        left: 16px;
        right: 16px;
        min-width: auto;
        max-width: none;
      }
    }

    .workflow-status {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-tertiary);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-default);
      box-shadow: var(--shadow-float);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .workflow-agent {
      color: var(--accent-secondary);
      font-weight: 600;
      font-size: 13px;
    }

    .workflow-sep {
      color: var(--text-tertiary);
      font-size: 12px;
    }

    .workflow-step {
      color: var(--text-secondary);
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="topbar">
      <div class="logo">✦</div>
      <div class="brand">
        <div class="heading">Agile AI Assistant</div>
        <div class="subheading">Agentic Coding Companion</div>
      </div>
      <div class="workflow-status" id="workflowStatus">
        <span class="workflow-agent" id="wfAgent">Agent</span>
        <span class="workflow-sep">|</span>
        <span class="workflow-step" id="wfStep">Step</span>
      </div>
    </div>
    
    <!-- Thoughts Box floating over chat -->
    <div class="thoughts-box" id="thoughtsBox" style="display: none;">
      <div class="thoughts-header" id="thoughtsHeader">
        <span>Reasoning Process</span>
        <span id="thoughtsToggle">▼</span>
      </div>
      <div class="thoughts-content" id="thoughtsContent"></div>
    </div>

    <div id="chat" class="chat-panel"></div>

    <div class="composer">
      <textarea id="input" class="input" rows="1" placeholder="Message the assistant..."></textarea>

      <div class="controls-panel">
        <button id="send" class="send">
          Send
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
        <div class="mode-row">
          <label for="Mode">Mode</label>
          <select name="Mode" id="Mode">
            <option value="planning">Planning</option>
            <option value="coding">Coding</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    const vscode = acquireVsCodeApi();
    const projectId = "{{projectId}}";

    const chat = document.getElementById('chat');
    const emptyState = document.getElementById('emptyState');
    const thoughtsBox = document.getElementById('thoughtsBox');
    const thoughtsContent = document.getElementById('thoughtsContent');
    let typingIndicator = null;
    let currentAssistantMessageDiv = null;
    let currentAssistantMessageContent = '';
    let currentAssistantThoughtContent = '';
    let lastStatusStr = '';
    let currentSystemMessageDiv = null;
    let statusIntervalId = null;
    let statusSeconds = 0;
    let statusDotCount = 0;
    let statusIsThinking = false;
    let statusBaseText = '';
    let autoScrollEnabled = true;
    let thoughtsAutoScrollEnabled = true;

    // New: processing state for abort button
    let isProcessing = false;

    const sendButton = document.getElementById('send');
    const inputArea = document.getElementById('input');
    const modeSelect = document.getElementById('Mode');

    function setProcessingState(processing) {
      isProcessing = processing;
      if (isProcessing) {
        sendButton.classList.add('abort');
        sendButton.innerHTML = `
          Abort
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
          </svg>
        `;
        inputArea.disabled = true;
        modeSelect.disabled = true;
      } else {
        sendButton.classList.remove('abort');
        sendButton.innerHTML = `
          Send
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        `;
        inputArea.disabled = false;
        modeSelect.disabled = false;
        inputArea.focus();
      }
    }

    function renderMessageText(text) {
      if (!text) return '';
      text = text.replace(/\\n/g, '\n');
      const blocks = [];
      text = text.replace(/```([\s\S]*?)```/g, (match, code) => {
        blocks.push(code);
        return `%%CODEBLOCK${blocks.length - 1}%%`;
      });

      let escaped = text.replace(/[&<>"]/g, function (m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        if (m === '"') return '&quot;';
        return m;
      });

      escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');

      escaped = escaped.replace(/%%CODEBLOCK(\d+)%%/g, (match, index) => {
        const code = blocks[index];
        const safeCode = code.replace(/[&<>]/g, function (m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          return m;
        });
        return `<pre class="codeblock"><code>${safeCode}</code></pre>`;
      });

      return escaped;
    }

    function addMessage(sender, text, isTyping = false) {
      if (emptyState) emptyState.style.display = 'none';
      
      if (sender === 'assistant' && typingIndicator) {
        typingIndicator.remove();
        typingIndicator = null;
      }

      const div = document.createElement('div');
      div.className = `message ${sender === 'user' ? 'user' : 'assistant'}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'rendered';

      if (isTyping) {
        const loader = document.createElement('div');
        loader.className = 'loader';
        for (let i = 0; i < 3; i++) {
          const dot = document.createElement('span');
          dot.className = 'dot';
          loader.appendChild(dot);
        }
        contentDiv.appendChild(loader);
        typingIndicator = div;
      } else {
        contentDiv.innerHTML = renderMessageText(text);
      }

      div.appendChild(contentDiv);
      chat.appendChild(div);
      if (autoScrollEnabled) {
        chat.scrollTop = chat.scrollHeight;
      }
    }

    // Thoughts box toggle
    document.getElementById('thoughtsHeader').onclick = function() {
      thoughtsBox.classList.toggle('expanded');
      const toggle = document.getElementById('thoughtsToggle');
      if (thoughtsBox.classList.contains('expanded')) {
        toggle.textContent = '▲';
        thoughtsContent.scrollTop = thoughtsContent.scrollHeight;
      } else {
        toggle.textContent = '▼';
      }
    };

    chat.addEventListener('scroll', () => {
      const isNearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 20;
      autoScrollEnabled = isNearBottom;
    });

    thoughtsContent.addEventListener('scroll', () => {
      const isNearBottom = thoughtsContent.scrollHeight - thoughtsContent.scrollTop - thoughtsContent.clientHeight < 20;
      thoughtsAutoScrollEnabled = isNearBottom;
    });

    sendButton.onclick = () => {
      if (isProcessing) {
        // Abort current request
        vscode.postMessage({ command: 'abortMessage' });
        setProcessingState(false);
        // Clear status messages
        if (statusIntervalId) {
          clearInterval(statusIntervalId);
          statusIntervalId = null;
        }
        if (currentSystemMessageDiv) {
          currentSystemMessageDiv.remove();
          currentSystemMessageDiv = null;
        }
        addMessage('assistant', '⏹️ Message generation was cancelled.', false);
        return;
      }

      const val = inputArea.value.trim();
      if (!val) return;

      autoScrollEnabled = true;
      addMessage('user', val);

      currentAssistantMessageDiv = null;
      currentAssistantMessageContent = '';
      thoughtsBox.style.display = 'none';
      thoughtsBox.classList.remove('expanded');
      document.getElementById('thoughtsToggle').textContent = '▼';
      thoughtsContent.textContent = '';
      thoughtsAutoScrollEnabled = true;

      if (currentSystemMessageDiv) {
        currentSystemMessageDiv.remove();
        currentSystemMessageDiv = null;
      }
      if (statusIntervalId) {
        clearInterval(statusIntervalId);
        statusIntervalId = null;
      }
      lastStatusStr = '';

      const mode = modeSelect.value;
      vscode.postMessage({
        command: 'sendMessage',
        text: val,
        planning: mode === 'planning'
      });

      inputArea.value = '';
      inputArea.style.height = 'auto';
      setProcessingState(true);
    };

    inputArea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !isProcessing) {
        e.preventDefault();
        sendButton.click();
      }
    });

    inputArea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });

    window.addEventListener('message', e => {
      const msg = e.data;

      // When processing ends (by completion or abort), reset button
      if (msg.type === 'processingEnded') {
        setProcessingState(false);
      }

      if (msg.type === 'addMessage') {
        addMessage(msg.sender, msg.message, false);
      } else if (msg.type === 'botChunk') {

        isProcessing = true;
        sendButton.classList.add('abort');
        sendButton.innerHTML = `
          Abort
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <line x1="9" y1="9" x2="15" y2="15"></line>
            <line x1="15" y1="9" x2="9" y2="15"></line>
          </svg>
        `;
        inputArea.disabled = true;
        modeSelect.disabled = true;

        if (!currentAssistantMessageDiv && !msg.chunk) {
          if (!currentSystemMessageDiv) {
            currentSystemMessageDiv = document.createElement('div');
            currentSystemMessageDiv.className = 'message assistant';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'rendered';
            currentSystemMessageDiv.appendChild(contentDiv);
            chat.appendChild(currentSystemMessageDiv);
            
            statusBaseText = 'Thinking';
            statusIsThinking = true;
            statusSeconds = 0;
            statusDotCount = 1;
            
            if (statusIntervalId) clearInterval(statusIntervalId);
            statusIntervalId = setInterval(() => {
              if (!currentSystemMessageDiv) {
                clearInterval(statusIntervalId);
                return;
              }
              statusSeconds++;
              statusDotCount = (statusDotCount % 4) + 1;
              let dots = '.'.repeat(statusDotCount);
              let displayStr = statusBaseText;
              if (statusIsThinking && statusSeconds >= 10) {
                const moreCount = Math.floor(statusSeconds / 10);
                if (moreCount === 1) {
                  displayStr = 'Thinking harder';
                } else if (moreCount > 1) {
                  const mores = 'more '.repeat(moreCount - 1);
                  displayStr = `Thinking ${mores}longer`;
                }
              }
              let cDiv = currentSystemMessageDiv.querySelector('.rendered');
              if (cDiv) cDiv.innerHTML = `<span class="status-text">${displayStr}${dots}</span>`;
            }, 1000);
          }
        } else if (!currentAssistantMessageDiv && msg.chunk) {
          if (statusIntervalId) {
            clearInterval(statusIntervalId);
            statusIntervalId = null;
          }
          if (currentSystemMessageDiv) {
            currentAssistantMessageDiv = currentSystemMessageDiv;
            currentSystemMessageDiv = null;
            currentAssistantMessageDiv.querySelector('.rendered').innerHTML = '';
          } else {
            currentAssistantMessageDiv = document.createElement('div');
            currentAssistantMessageDiv.className = 'message assistant';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'rendered';
            currentAssistantMessageDiv.appendChild(contentDiv);
            chat.appendChild(currentAssistantMessageDiv);
          }
        }
        
        if (currentAssistantMessageDiv && msg.chunk) {
          const contentDiv = currentAssistantMessageDiv.querySelector('.rendered');
          currentAssistantMessageContent += msg.chunk;
          contentDiv.innerHTML = renderMessageText(currentAssistantMessageContent);
        }
        
        if (msg.thoughtChunk) {
          currentAssistantThoughtContent += msg.thoughtChunk;
          thoughtsBox.style.display = 'flex';
          thoughtsContent.textContent = currentAssistantThoughtContent;
          
          if (thoughtsAutoScrollEnabled) {
            thoughtsContent.scrollTop = thoughtsContent.scrollHeight;
          }
        }

        if (autoScrollEnabled) {
          chat.scrollTop = chat.scrollHeight;
        }
      } else if (msg.type === 'botMessage') {
        if (currentAssistantMessageDiv) {
          const contentDiv = currentAssistantMessageDiv.querySelector('.rendered');
          if (msg.message) {
            contentDiv.innerHTML = renderMessageText(msg.message);
          }
          if (msg.thought) {
            thoughtsBox.style.display = 'flex';
            thoughtsContent.textContent = msg.thought;
            if (thoughtsAutoScrollEnabled) {
              thoughtsContent.scrollTop = thoughtsContent.scrollHeight;
            }
          }
          currentAssistantMessageDiv = null;
          currentAssistantMessageContent = '';
          currentAssistantThoughtContent = '';
        } else if (msg.message || msg.thought) {
          if (msg.message) {
            addMessage('assistant', msg.message, false);
          }
          if (msg.thought) {
            thoughtsBox.style.display = 'flex';
            thoughtsContent.textContent = msg.thought;
            if (thoughtsAutoScrollEnabled) {
              thoughtsContent.scrollTop = thoughtsContent.scrollHeight;
            }
          }
        }

        currentAssistantMessageContent = '';
        currentAssistantThoughtContent = '';
        if (autoScrollEnabled) {
          chat.scrollTop = chat.scrollHeight;
        }

        if (msg.actions) {
          console.log('Actions:', msg.actions);
        }
        // After final message, reset processing state (extension will also send processingEnded)
        setProcessingState(false);
        if (statusIntervalId) clearInterval(statusIntervalId);
        if (currentSystemMessageDiv) {
          currentSystemMessageDiv.remove();
          currentSystemMessageDiv = null;
        }
      } else if (msg.type === 'error') {
        setProcessingState(false);
        addMessage('assistant', `❌ ${msg.message}`, false);
        currentAssistantMessageDiv = null;
        currentAssistantMessageContent = '';
      } else if (msg.type === 'clearMessages') {
        setProcessingState(false);
        if (statusIntervalId) {
          clearInterval(statusIntervalId);
          statusIntervalId = null;
        }
        chat.innerHTML = '';
        if (emptyState) emptyState.style.display = 'block';
        currentAssistantMessageDiv = null;
        currentAssistantMessageContent = '';
        currentAssistantThoughtContent = '';
        lastStatusStr = '';
        currentSystemMessageDiv = null;
        
        thoughtsBox.style.display = 'none';
        thoughtsBox.classList.remove('expanded');
        document.getElementById('thoughtsToggle').textContent = '▼';
        thoughtsContent.textContent = '';
        thoughtsAutoScrollEnabled = true;
      } else if (msg.type === 'statusUpdate') {
        const wfStatus = document.getElementById('workflowStatus');
        const wfAgent = document.getElementById('wfAgent');
        const wfStep = document.getElementById('wfStep');

        if (msg.currentAgent && msg.currentStep && msg.currentAgent !== 'unknown' && msg.currentStep !== 'unknown' && msg.data !== 'IDLE') {
          wfAgent.textContent = msg.currentAgent;
          wfStep.textContent = msg.currentStep;
          if (wfStatus) wfStatus.style.opacity = '1';
        } else {
          if (wfStatus) wfStatus.style.opacity = '0';
        }

        if (msg.data === 'IDLE' || msg.data.status === 'IDLE' || (msg.data.message && msg.data.message === 'IDLE')) {
          if (currentSystemMessageDiv) {
            currentSystemMessageDiv.remove();
            currentSystemMessageDiv = null;
          }
          if (statusIntervalId) {
            clearInterval(statusIntervalId);
            statusIntervalId = null;
          }
          lastStatusStr = 'IDLE';
          return;
        }

        if (currentAssistantMessageDiv) return;

        if (msg.data && msg.data.message) {
          const str = msg.data.object ? msg.data.object + '|' + msg.data.message : msg.data.message;
          if (str !== lastStatusStr) {
            lastStatusStr = str;
            let textToShow = `${msg.data.message}`;
            if (msg.data.message.includes('INITIAL')) {
              textToShow = msg.data.message;
            } else if (msg.data.object === 'LLM' && msg.data.message === 'THINKING') {
              textToShow = 'Thinking';
            }

            if (!currentSystemMessageDiv) {
              currentSystemMessageDiv = document.createElement('div');
              currentSystemMessageDiv.className = 'message assistant';
              const contentDiv = document.createElement('div');
              contentDiv.className = 'rendered';
              currentSystemMessageDiv.appendChild(contentDiv);
              chat.appendChild(currentSystemMessageDiv);
            }

            statusBaseText = textToShow;
            statusIsThinking = (msg.data.object === 'LLM' && msg.data.message === 'THINKING');
            statusSeconds = 0;
            statusDotCount = 1;

            currentSystemMessageDiv.querySelector('.rendered').innerHTML = `<span class="status-text">${statusBaseText}.</span>`;
            if (autoScrollEnabled) {
              chat.scrollTop = chat.scrollHeight;
            }

            if (statusIntervalId) clearInterval(statusIntervalId);
            statusIntervalId = setInterval(() => {
              if (!currentSystemMessageDiv) {
                clearInterval(statusIntervalId);
                return;
              }
              statusSeconds++;
              statusDotCount = (statusDotCount % 4) + 1;
              let dots = '.'.repeat(statusDotCount);
              let displayStr = statusBaseText;
              if (statusIsThinking && statusSeconds >= 10) {
                const moreCount = Math.floor(statusSeconds / 10);
                if (moreCount === 1) {
                  displayStr = 'Thinking harder';
                } else if (moreCount > 1) {
                  const mores = 'more '.repeat(moreCount - 1);
                  displayStr = `Thinking ${mores}longer`;
                }
              }
              let cDiv = currentSystemMessageDiv.querySelector('.rendered');
              if (cDiv) cDiv.innerHTML = `<span class="status-text">${displayStr}${dots}</span>`;
            }, 1000);
          }
        }
      }
    });
  </script>
</body>
</html>
