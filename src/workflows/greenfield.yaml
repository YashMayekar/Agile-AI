# greenfield.yaml
# Dynamic workflow for greenfield projects
# Each step is interpreted based on its dependencies and control fields.
# State variables (like {{stories}}, {{storyIndex}}) are managed by the orchestrator.

type: greenfield
version: 2                     # increased version to indicate new schema

# Global variables that can be referenced in steps
variables:
  stories: []                  # will be populated after sharding
  currentStoryIndex: 0
  qaLeftUnchecked: false

steps:
  - id: 0
    name: Initial Project Setup
    agent: orchestrator
    notes: |
      Greet User and gather initial information.
      confirm project details before proceeding.
    next: 1
    
  - id: 1
    name: Project Brief Creation
    agent: analyst
    creates:
      - project-brief.md
    template: project-brief-tmpl
    notes: "Create project brief from user input."

  - id: 2
    name: Product Requirements Document (PRD) Creation
    agent: pm
    requires:
      - project-brief.md
    creates:
      - prd.md
    template: prd-tmpl
    notes: "Generate PRD from project brief."

  - id: 3
    name: UI/UX Specification Creation
    agent: ux-expert
    requires:
      - prd.md
    creates:
      - front-end-spec.md
    template: front-end-spec-tmpl
    notes: "Create UI/UX specification."

  - id: 4
    name: Fullstack Architecture Creation
    agent: architect
    requires:
      - prd.md
      - front-end-spec.md
    creates:
      - fullstack-architecture.md
    template: fullstack-architecture-tmpl
    notes: "Design fullstack architecture, may suggest PRD updates."

  - id: 5
    name: PRD Update Based on Architecture Feedback
    agent: pm
    requires:
      - fullstack-architecture.md
      - prd.md
    updates:
      - prd.md
    template: prd-tmpl
    notes: "Incorporate architecture feedback into PRD."

  - id: 6
    name: Documentation Review and Validation
    agent: po
    requires:
      - po-master-checklist
      - all_documents                      # special keyword meaning all docs created so far
    creates:
      - validation-report.md
    template: validation-report-tmpl
    notes: "Validate all documents for consistency."

  - id: 7
    name: PRD Sharding for Development
    agent: po
    requires:
      - all_documents
    creates:
      - sharded_docs                         # meta‑artifact, triggers population of stories list
    template: sharding-tmpl
    notes: "Split PRD into epics/stories. After this step, the 'stories' variable is set."
    after: |
      # This block is executed by the orchestrator after the step completes
      state.dynamicContext.stories = extract_stories_from_output()   # pseudo‑code

  # ------------------------------------------------------------------------
  # Story development loop – steps 8 to 15 are repeated for each story
  # The loop is controlled by a special step that expands into instances.
  # ------------------------------------------------------------------------
  - id: 8
    name: Epic Creation
    agent: sm
    # This step runs once per story, creating a story file named dynamically
    loop:
      over: stories                     # iterate over the list stored in state
      as: storyIndex                    # variable name for the current index
    creates:
      - "story-{{storyIndex}}.md"        # filename includes the index
    template: story-tmpl
    requires:
      - sharded_docs
    notes: "Create a story file for epic {{storyIndex}}."

  - id: 9
    name: Story Review and Approval
    agent: pm
    requires:
      - "story-{{storyIndex}}.md"
    updates:
      - "story-{{storyIndex}}.md"
    template: story-tmpl
    notes: "Review and approve the story (changes status from Draft to Approved)."
    # This step also runs once per story; it is implicitly part of the loop because
    # it depends on a loop‑generated document. The orchestrator will treat it as
    # a separate instance for each story (like 9‑1, 9‑2, ...).

  - id: 10
    name: Story Implementation
    agent: dev
    requires:
      - "story-{{storyIndex}}.md"
      - implementation-rules.md
    creates:
      - "implementation-{{storyIndex}}/"     # directory for this story's files
    # Actual file creation is handled by the agent; we track the directory as created
    template: implementation-tmpl
    notes: "Implement the story."

  - id: 11
    name: QA Review of Implementation
    agent: qa
    requires:
      - "implementation-{{storyIndex}}/"
    # QA may update implementation files
    updates:
      - "implementation-{{storyIndex}}/"
    template: implementation-tmpl
    notes: "Review implementation, may leave unchecked items."
    after: |
      # After QA, set qaLeftUnchecked based on review outcome
      state.dynamicContext.qaLeftUnchecked = review_had_unchecked_items()

  - id: 12
    name: Addressing QA Feedback
    agent: dev
    # This step runs only if qaLeftUnchecked is true
    condition:
      variable: qaLeftUnchecked
      equals: true
    requires:
      - "implementation-{{storyIndex}}/"
    updates:
      - "implementation-{{storyIndex}}/"
    template: implementation-tmpl
    notes: "Fix issues left by QA."
    after: |
      # After fixing, we may need to loop back to QA (step 11) for final review.
      # This is handled by the next field.
    next:
      default: 13                        # go to final step if condition false
      condition: "qaLeftUnchecked"        # if still unchecked, repeat QA
      conditionNext: 11

  - id: 13
    name: Mark Story Complete
    agent: sm
    requires:
      - "implementation-{{storyIndex}}/"
    updates:
      - "story-{{storyIndex}}.md"
    template: story-tmpl
    notes: "Update story status to Done."
    after: |
      # Increment story index for the next iteration
      state.dynamicContext.currentStoryIndex += 1
    # After this step, the orchestrator checks if there are more stories.
    # If yes, it will restart the loop at step 8 with the next index.
    # If no, it proceeds to step 16.

  # ------------------------------------------------------------------------
  # End of story loop
  # ------------------------------------------------------------------------

  - id: 16
    name: All Stories Complete
    agent: system
    requires:
      - condition: "currentStoryIndex >= stories.length"
    # This step is a dummy; it just marks that the loop is finished.
    notes: "All stories have been processed."

  - id: 17
    name: Epic Retrospective (Optional)
    agent: po
    condition:
      variable: user_requested_retrospective    # could be set via user input
      equals: true
    creates:
      - epic-retrospective.md
    template: retrospective-tmpl
    notes: "Optional retrospective after epic completion."

  - id: 18
    name: Project Complete
    agent: system
    requires:
      - id: 16                                # all stories done
    notes: "All development phases finished."