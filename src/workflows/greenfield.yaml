type: greenfield
version: 1
sequence:
  - id: 01
    step: Project Brief Creation
    agent: analyst
    creates: 
    - project-brief.md
    template: project-brief-tmpl
    next: 02
    optional_steps:
    - brainstorming_session
    notes: "Can do brainstorming first, then optional deep research before creating project brief. SAVE OUTPUT: Copy final project-brief.md to your project's docs/ folder."

  - id: 02
    step: Product Requirements Document (PRD) Creation
    agent: pm
    creates: 
    - prd.md
    requires: 
    - project-brief.md
    next: 03
    return_id: 01
    notes: "Creates PRD from project brief using prd-tmpl. SAVE OUTPUT: Copy final prd.md to your project's docs/ folder."

  - id: 03
    optional: true
    agent: ux-expert
    creates: 
    - front-end-spec.md
    requires: 
    - prd.md
    next: 05
    optional_steps:
    - user_research_prompt
    notes: "Creates UI/UX specification using front-end-spec-tmpl. SAVE OUTPUT: Copy final front-end-spec.md to your project's docs/ folder."

  - id: 04
    optional: true
    agent: ux-expert
    creates: 
    - v0_prompt.md
    requires: 
    - front-end-spec.md
    next: 05
    condition: user_wants_ai_generation
    notes: "OPTIONAL BUT RECOMMENDED: Generate AI UI prompt for tools like v0, Lovable, etc. Use the generate-ai-frontend-prompt task. User can then generate UI in external tool and download project structure."

  - id: 05
    agent: architect
    creates: 
    - fullstack-architecture.md
    requires:
    - prd.md
    - front-end-spec.md
    next: 07
    optional_steps:
    - technical_research_prompt
    - review_generated_ui_structure
    notes: "Creates comprehensive architecture using fullstack-architecture-tmpl. If user generated UI with v0/Lovable, can incorporate the project structure into architecture. May suggest changes to PRD stories or new stories. SAVE OUTPUT: Copy final fullstack-architecture.md to your project's docs/ folder."

  - id: 06
    optional: true
    agent: pm
    updates: 
    - prd.md
    requires: 
    - fullstack-architecture.md
    next: 07
    condition: architecture_suggests_prd_changes
    notes: "If architect suggests story changes, update PRD and re-export the complete unredacted prd.md to docs/ folder."

  - id: 07
    agent: po
    validates: 
    - all_artifacts
    requires: 
    - po-master-checklist
    next: 11
    notes: "Validates all documents for consistency and completeness. May require updates to any document."

  - id: 08
    agent: various
    updates: any_flagged_documents
    condition: po_checklist_issues
    notes: "If PO finds issues, return to relevant agent to fix and re-export updated documents to docs/ folder."

  - id: 09
    step: project_setup_guidance
    action: guide_project_structure
    condition: user_has_generated_ui
    notes: "If user generated UI with v0/Lovable: For polyrepo setup, place downloaded project in separate frontend repo alongside backend repo. For monorepo, place in apps/web or packages/frontend directory. Review architecture document for specific guidance."

  - id: 10
    step: development_order_guidance
    action: guide_development_sequence
    notes: "Based on PRD stories: If stories are frontend-heavy, start with frontend project/directory first. If backend-heavy or API-first, start with backend. For tightly coupled features, follow story sequence in monorepo setup. Reference sharded PRD epics for development order."

  - id: 11
    agent: po
    action: shard_documents
    creates: 
    - sharded_docs
    requires: 
    - all_artifacts
    next: 12
    notes:
    Shard documents for IDE development:
    - Option A: Use PO agent to shard @po then ask to shard docs/prd.md
    - Option B: Manual Drag shard-doc task + docs/prd.md into chat
    - Creates docs/prd/ and docs/architecture/ folders with sharded content

  - id: 12
    agent: sm
    action: create_story
    creates: 
    - story.md
    requires: 
    - sharded_docs
    next: 13
    repeats: for_each_epic
    notes: 
    Story creation cycle:
    - SM Agent (New Chat): sm → *create
    - Creates next story from sharded docs
    - Story starts in "Draft" status

  - id: 13
    agent: pm
    action: review_draft_story
    updates: 
    - story.md
    requires: 
    - story.md
    optional: true
    next: 14
    condition: user_wants_story_review
    OPTIONAL: 
    - Review and approve draft story
    - NOTE story-review task coming soon
    - Review story completeness and alignment
    - Update story status Draft → Approved  

  - id: 14
    agent: dev
    action: implement_story
    creates: 
    - implementation_files
    requires: 
    - story.md
    Dev Agent (New Chat): 
    - dev
    - Implements approved story
    - Updates File List with all changes
    - Marks story as "Review" when complete

  - id: 15
    agent: qa
    action: review_implementation
    updates: 
    - implementation_files
    requires: 
    - implementation_files
    optional: true
    OPTIONAL: 
    - QA Agent (New Chat) @qa → review-story
    - Senior dev review with refactoring ability
    - Fixes small issues directly
    - Leaves checklist for remaining items
    - Updates story status (Review → Done or stays Review)

  - id: 16
    agent: dev
    action: address_qa_feedback
    updates: implementation_files
    condition: qa_left_unchecked_items
    notes: 
    If QA left unchecked items:
    - Dev Agent (New Chat): Address remaining items
    - Return to QA for final approval

  - id: 17
    step: repeat_development_cycle
    action: continue_for_all_stories
    notes: 
    - Repeat story cycle (SM → Dev → QA) for all epic stories
    - Continue until all stories in PRD are complete

  - id: 18
    agent: po
    action: epic_retrospective
    creates: epic-retrospective.md
    condition: epic_complete
    optional: true
    notes:
    OPTIONAL:
    - After epic completion
    - NOTE epic-retrospective task coming soon
    - Validate epic was completed correctly
    - Document learnings and improvements

  - id: 19
    step: workflow_end
    action: project_complete
    notes:
    - All stories implemented and reviewed!
    - Project development phase complete.

decision_guidance:
when_to_use:
    - Building production-ready applications
    - Multiple team members will be involved
    - Complex feature requirements
    - Need comprehensive documentation
    - Long-term maintenance expected
    - Enterprise or customer-facing applications

handoff_prompts:
    analyst_to_pm: "Project brief is complete. Save it as docs/project-brief.md in your project, then create the PRD."
    pm_to_ux: "PRD is ready. Save it as docs/prd.md in your project, then create the UI/UX specification."
    ux_to_architect: "UI/UX spec complete. Save it as docs/front-end-spec.md in your project, then create the fullstack architecture."
    architect_review: "Architecture complete. Save it as docs/fullstack-architecture.md. Do you suggest any changes to the PRD stories or need new stories added?"
    architect_to_pm: "Please update the PRD with the suggested story changes, then re-export the complete prd.md to docs/."
    updated_to_po: "All documents ready in docs/ folder. Please validate all artifacts for consistency."
    po_issues: "PO found issues with [document]. Please return to [agent] to fix and re-save the updated document."
    complete: "All planning artifacts validated and saved in docs/ folder. Move to IDE environment to begin development."